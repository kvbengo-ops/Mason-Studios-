# Local parity with Render (see render.yaml): the same two containers,
# built from the same Dockerfiles, wired with the same env vars.
#
# This application-container workflow expects HOSTED Supabase settings.
# For a Docker-backed LOCAL database, use `make db-start`, `make db-env`,
# then `make dev` instead (see docs/local-development.md). The local stack
# is managed by the Supabase CLI and the app/worker run on the host.
# Loopback URLs generated by db-env do not work inside these containers.
#
# MODE=development in both env files mocks vendor calls. It does not make
# writes to a hosted database local.
#
# Build args (below) only pull from the shell / a root .env — `env_file:`
# is a runtime-only directive in Compose, it does not feed build args. So
# run this with:
#   docker compose --env-file web/.env.local up --build
# Otherwise the NEXT_PUBLIC_* build args come through blank and the browser
# bundle ships with `undefined` (see web/Dockerfile comments).

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined at build time (see web/Dockerfile
        # comments) — they must be passed as build args, not just runtime
        # environment, or the browser bundle ships with `undefined`.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_THEME: ${NEXT_PUBLIC_THEME}
    env_file:
      - ./web/.env.local
    environment:
      # Dev port for web is 9000 locally; in the container it must bind
      # whatever $PORT it's given, matching how Render injects PORT.
      PORT: "9000"
    ports:
      - "9000:9000"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - ./worker/.env
    ports:
      - "8080:8080"
